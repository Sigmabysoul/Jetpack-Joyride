<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#23305e">
  <meta name="description" content="A calm one-touch game. Let go, drift to the next light, and make quiet music as the sky turns from dusk to dawn.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>lumen</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="Game canvas. Tap, click or press space to let go of the light."></canvas>

  <!-- In-game HUD -->
  <div id="hud" class="hidden" aria-live="polite">
    <div id="score">0</div>
    <div id="dustHud"><span class="mote" aria-hidden="true"></span><span id="dustCount">0</span></div>
    <button id="pauseBtn" class="icon-btn" aria-label="Pause">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="6.5" y="5" width="3.2" height="14" rx="1.4"/><rect x="14.3" y="5" width="3.2" height="14" rx="1.4"/></svg>
    </button>
  </div>
  <div id="hint" class="hint" aria-hidden="true"></div>

  <!-- Home -->
  <section id="menu" class="screen">
    <div class="menu-inner">
      <h1 class="title">lumen</h1>
      <p class="tagline">Let go. Drift to the next light.</p>

      <button id="playBtn" class="orb-btn" aria-label="Begin">
        <span class="orb-glow" aria-hidden="true"></span>
        <span class="orb-label">begin</span>
      </button>

      <div class="modes" role="radiogroup" aria-label="Mode">
        <button class="mode" role="radio" data-mode="flow">
          <span class="mode-name">Flow</span>
          <span class="mode-desc">One light, one journey</span>
        </button>
        <button class="mode" role="radio" data-mode="zen">
          <span class="mode-name">Zen</span>
          <span class="mode-desc">No endings, just drift</span>
        </button>
      </div>

      <div class="lights" aria-label="Choose your light">
        <div id="lightRow" class="light-row"></div>
        <p id="lightName" class="light-name"></p>
      </div>

      <p id="stats" class="stats"></p>
    </div>
    <button id="soundBtn" class="icon-btn corner" aria-label="Sound on"></button>
  </section>

  <!-- Game over -->
  <section id="over" class="screen hidden">
    <div class="menu-inner">
      <p class="over-kicker" id="overKicker">The light rests</p>
      <div class="over-score" id="overScore">0</div>
      <p class="over-label">lights reached</p>
      <p class="over-best" id="overBest"></p>
      <p class="over-dust" id="overDust"></p>
      <p class="over-unlock hidden" id="overUnlock"></p>
      <div class="row">
        <button id="againBtn" class="btn primary">Drift again</button>
        <button id="homeBtn" class="btn">Home</button>
      </div>
      <p class="over-tip" id="overTip"></p>
    </div>
  </section>

  <!-- Pause -->
  <section id="pause" class="screen hidden">
    <div class="menu-inner">
      <p class="over-kicker">Paused</p>
      <p class="tagline">Breathe in. Breathe out.</p>
      <div class="row">
        <button id="resumeBtn" class="btn primary">Resume</button>
        <button id="quitBtn" class="btn">Home</button>
      </div>
    </div>
  </section>

  <noscript><p class="noscript">Lumen needs JavaScript to run.</p></noscript>
  <script src="game.js"></script>
</body>
</html>
