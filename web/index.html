<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jetpack Joyride (Go + Ebitengine)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #1e2230 0%, #0d1117 100%);
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }
    header {
      margin-bottom: 12px;
      text-align: center;
    }
    header h1 {
      font-size: 1.8rem;
      letter-spacing: 2px;
      color: #ffcc00;
      text-shadow: 0 2px 8px rgba(255, 204, 0, 0.4);
    }
    #game-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #30363d;
      background: #000;
    }
    canvas {
      display: block;
      outline: none;
      max-width: 100vw;
      max-height: 80vh;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 17, 23, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #ffcc00;
      transition: opacity 0.4s ease;
      z-index: 10;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 204, 0, 0.2);
      border-top-color: #ffcc00;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    footer {
      margin-top: 14px;
      text-align: center;
      font-size: 0.95rem;
      color: #8b949e;
    }
    footer kbd {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 2px 6px;
      font-family: monospace;
      color: #58a6ff;
    }
  </style>
  <script src="wasm_exec.js"></script>
</head>
<body>
  <header>
    <h1>JETPACK JOYRIDE</h1>
  </header>

  <div id="game-container">
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div id="loading-text">Loading WebAssembly Bundle...</div>
    </div>
  </div>

  <footer>
    <p>Controls: <kbd>SPACE</kbd> / <kbd>UP ARROW</kbd> / <kbd>LEFT CLICK</kbd> to fly &bull; <kbd>ESC</kbd> for menu</p>
  </footer>

  <script>
    const go = new Go();
    const loadingOverlay = document.getElementById("loading-overlay");
    const loadingText = document.getElementById("loading-text");

    async function run() {
      try {
        loadingText.textContent = "Loading WebAssembly...";
        let result;
        if (WebAssembly.instantiateStreaming) {
          try {
            result = await WebAssembly.instantiateStreaming(fetch("game.wasm"), go.importObject);
          } catch (e) {
            console.warn("instantiateStreaming failed, falling back to arrayBuffer:", e);
          }
        }
        if (!result) {
          const resp = await fetch("game.wasm");
          const bytes = await resp.arrayBuffer();
          result = await WebAssembly.instantiate(bytes, go.importObject);
        }

        loadingOverlay.style.opacity = "0";
        setTimeout(() => loadingOverlay.style.display = "none", 400);

        go.run(result.instance);
      } catch (err) {
        console.error("WASM loading error:", err);
        loadingText.innerHTML = "Failed to load WebAssembly game.<br><small style='color:#f85149;font-size:0.8rem;'>" + err + "</small>";
      }
    }

    run();
  </script>
</body>
</html>
